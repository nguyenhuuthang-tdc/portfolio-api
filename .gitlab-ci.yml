stages:
  - production

# Enable GitLab Container Registry on this project.
# VPS once: mkdir TARGET_DIR, copy .env.example → .env, runner tag "vps".
# No git clone of the app is required in TARGET_DIR.

build-production:
  stage: production
  only:
    - main
  tags:
    - vps
  when: manual
  variables:
    DOCKER_IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE
    DOCKER_CONTAINER_NAME: portfolio-api
    TARGET_DIR: /home/tom/services/porfolio/porfolio-api
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - chmod u+x ./scripts/build.sh ./scripts/run.sh
    - ./scripts/build.sh
    - docker push "${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}"
    - mkdir -p "${TARGET_DIR}"
    - cp docker-compose.yml "${TARGET_DIR}/docker-compose.yml"
    - ./scripts/run.sh
